<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - PinRoll</title>

    <!-- FAVICON Y2K PETIR PINROLL -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%231e293b%22/><text y=%22.9em%22 font-size=%2280%22>⚡</text></svg>">

    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-deep: #0f172a;
            --denim-dark: #1e293b;
            --denim-blue: #3b82f6;
            --pastel-blue: #bae6fd;
            --pastel-pink: #fbcfe8;
            --pastel-yellow: #fef08a;
            --white: #ffffff;
            --border-y2k: 3px solid var(--navy-deep);
            --shadow-y2k: 5px 5px 0px var(--navy-deep);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #cbd5e1; background-image: radial-gradient(var(--denim-blue) 12%, transparent 13%), radial-gradient(var(--pastel-pink) 12%, transparent 13%); background-size: 28px 28px; color: var(--navy-deep); padding-bottom: 50px; }

        header { background: var(--denim-dark); border-bottom: var(--border-y2k); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'VT323', monospace; font-size: 2.3rem; color: var(--pastel-yellow); text-decoration: none; }

        .container { max-width: 950px; margin: 30px auto; padding: 0 20px; }
        .section-title { font-family: 'VT323', monospace; font-size: 2.2rem; background: var(--pastel-yellow); display: inline-block; padding: 4px 18px; border: var(--border-y2k); box-shadow: 3px 3px 0px var(--navy-deep); margin-bottom: 20px; }

        .table-card { background: var(--white); border: var(--border-y2k); box-shadow: var(--shadow-y2k); border-radius: 14px; padding: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 15px; border-bottom: 2px solid #e2e8f0; }
        th { background: var(--pastel-blue); font-weight: 800; border-bottom: var(--border-y2k); }

        .btn-act { padding: 6px 10px; border: 2px solid var(--navy-deep); border-radius: 6px; font-weight: bold; cursor: pointer; box-shadow: 2px 2px 0px var(--navy-deep); }
        .btn-acc { background: #4ade80; }
        .btn-del { background: #f87171; color: white; }

        /* SYSTEM LOGIN SEDERHANA */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--denim-dark); display: flex; justify-content: center; align-items: center; z-index: 999; }
        .login-box { background: var(--white); border: var(--border-y2k); box-shadow: 8px 8px 0px var(--pastel-pink); border-radius: 16px; padding: 30px; width: 90%; max-width: 380px; text-align: center; }
    </style>
</head>
<body>

    <!-- OVERLAY LOGIN DENGAN PASSWORD KEEPER (Default Pass: pinroll123) -->
    <div class="login-overlay" id="loginArea">
        <div class="login-box">
            <h2 style="font-family: 'VT323', monospace; font-size: 2.2rem; margin-bottom: 10px;">🔑 ADMIN PINROLL</h2>
            <p style="font-size: 0.85rem; margin-bottom: 15px;">Masukan kata sandi untuk mengelola pesanan:</p>
            <input type="password" id="passInput" placeholder="Sandi Admin" style="width: 100%; padding: 10px; border: 2px solid #000; border-radius: 8px; margin-bottom: 15px;">
            <button onclick="cekLogin()" style="width: 100%; padding: 12px; background: var(--pastel-pink); border: 2px solid #000; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 3px 3px 0px #000;">MASUK DASPOT ⚡</button>
        </div>
    </div>

    <header>
        <a href="#" class="logo">⚡ DASHBOARD ADMIN PINROLL</a>
    </header>

    <div class="container">
        <h2 class="section-title">✦ DAFTAR PESANAN SEWA MASUK</h2>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Tgl</th>
                        <th>Nama Pemesan</th>
                        <th>Kelas</th>
                        <th>Paket</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabelPesanan">
                    <!-- Data pesanan siswa dari sewa.html akan otomatis muncul di sini -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function cekLogin() {
            const pass = document.getElementById('passInput').value;
            if (pass === 'josjis') { // Kata sandi default admin
                document.getElementById('loginArea').style.display = 'none';
                muatData();
            } else {
                alert('Sandi salah!');
            }
        }

        function muatData() {
            const dataPesanan = JSON.parse(localStorage.getItem('pinroll_orders')) || [];
            const tbody = document.getElementById('tabelPesanan');
            tbody.innerHTML = '';

            if (dataPesanan.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Belum ada pesanan masuk.</td></tr>`;
                return;
            }

            dataPesanan.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.tanggal}</td>
                        <td><strong>${item.nama}</strong></td>
                        <td>${item.kelas}</td>
                        <td>${item.paket}</td>
                        <td><span style="background: ${item.status === 'Selesai' ? '#4ade80' : '#fef08a'}; padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; border: 1px solid #000; font-weight: bold;">${item.status}</span></td>
                        <td>
                            <button class="btn-act btn-acc" onclick="ubahStatus(${index})">✓</button>
                            <button class="btn-act btn-del" onclick="hapusPesanan(${index})">✕</button>
                        </td>
                    </tr>
                `;
            });
        }

        function ubahStatus(index) {
            let dataPesanan = JSON.parse(localStorage.getItem('pinroll_orders'));
            dataPesanan[index].status = 'Selesai';
            localStorage.setItem('pinroll_orders', JSON.stringify(dataPesanan));
            muatData();
        }

        function hapusPesanan(index) {
            let dataPesanan = JSON.parse(localStorage.getItem('pinroll_orders'));
            dataPesanan.splice(index, 1);
            localStorage.setItem('pinroll_orders', JSON.stringify(dataPesanan));
            muatData();
        }
    </script>
</body>
</html>
