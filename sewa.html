<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sewa Rollan - PinRoll</title>

    <!-- FAVICON Y2K PETIR PINROLL -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%231e293b%22/><text y=%22.9em%22 font-size=%2280%22>⚡</text></svg>">
    
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-deep: #0f172a;
            --denim-dark: #1e293b;
            --denim-blue: #3b82f6;
            --pastel-blue: #bae6fd;
            --pastel-pink: #fbcfe8;
            --pastel-yellow: #fef08a;
            --white: #ffffff;
            --border-y2k: 3px solid var(--navy-deep);
            --shadow-y2k: 5px 5px 0px var(--navy-deep);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #cbd5e1; background-image: radial-gradient(var(--denim-blue) 12%, transparent 13%), radial-gradient(var(--pastel-pink) 12%, transparent 13%); background-size: 28px 28px; background-position: 0 0, 14px 14px; color: var(--navy-deep); padding-bottom: 50px; }

        header { background: var(--denim-dark); border-bottom: var(--border-y2k); padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-family: 'VT323', monospace; font-size: 2.3rem; color: var(--pastel-pink); text-decoration: none; letter-spacing: 2px; }
        .nav-btn { background: var(--pastel-blue); color: var(--navy-deep); text-decoration: none; font-weight: 800; font-size: 0.85rem; padding: 8px 14px; border: 2px solid var(--navy-deep); border-radius: 10px; box-shadow: 3px 3px 0px var(--navy-deep); transition: all 0.2s ease; }
        .nav-btn:hover { transform: translate(-2px, -2px); background: var(--pastel-yellow); }

        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .section-title { font-family: 'VT323', monospace; font-size: 2.2rem; background: var(--pastel-pink); display: inline-block; padding: 4px 18px; border: var(--border-y2k); box-shadow: 3px 3px 0px var(--navy-deep); margin-bottom: 20px; }

        .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .price-card { background: var(--white); border: var(--border-y2k); box-shadow: var(--shadow-y2k); border-radius: 14px; padding: 25px; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.25s ease; }
        .price-card:hover { transform: translate(-5px, -5px); box-shadow: 10px 10px 0px var(--navy-deep); }
        .price-card.popular { background: #f0fdf4; }

        .btn-sewa { background: var(--pastel-pink); color: var(--navy-deep); font-weight: 800; border: var(--border-y2k); box-shadow: 4px 4px 0px var(--navy-deep); padding: 12px; border-radius: 10px; cursor: pointer; width: 100%; transition: all 0.15s ease; }
        .btn-sewa:hover { background: #f472b6; transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--navy-deep); }

        /* MODAL POPUP FORM */
        .modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-body { background: var(--white); border: var(--border-y2k); box-shadow: 10px 10px 0px var(--navy-deep); border-radius: 16px; width: 100%; max-width: 420px; padding: 25px; position: relative; }
        .close-modal { position: absolute; top: 12px; right: 15px; font-size: 1.2rem; cursor: pointer; background: var(--pastel-pink); border: 2px solid var(--navy-deep); border-radius: 50%; width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 700; font-size: 0.9rem; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 2px solid var(--navy-deep); border-radius: 8px; font-size: 0.95rem; }

        .btn-kirim { background: #4ade80; color: var(--navy-deep); font-weight: 800; border: var(--border-y2k); box-shadow: 4px 4px 0px var(--navy-deep); padding: 12px; width: 100%; border-radius: 10px; cursor: pointer; font-size: 1.05rem; transition: all 0.2s ease; }
        .btn-kirim:hover { background: #22c55e; transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--navy-deep); }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">⚡ PinRoll</a>
        <a href="index.html" class="nav-btn">← Kembali ke Utama</a>
    </header>

    <div class="container">
        <h2 class="section-title">✦ FORM PEMINJAMAN ROLLAN</h2>
        <div class="pricing-grid">
            
            <div class="price-card popular">
                <div>
                    <h3>Sewa Per Jam</h3>
                    <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 10px;">Untuk kebutuhan mendadak saat KBM[cite: 6]</p>
                    <div style="font-size: 1.8rem; font-weight: 800; color: var(--denim-blue); margin-bottom: 15px;">Rp 3.000 <span style="font-size: 0.9rem; color:#64748b;">/ jam</span></div>
                </div>
                <button class="btn-sewa" onclick="openModal('Sewa Per Jam (Rp 3.000/jam)')">PILIH PAKET INI ⚡</button>
            </div>

            <div class="price-card">
                <div>
                    <h3>Paket Mingguan</h3>
                    <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 10px;">Bebas pakai buat sekelas seminggu penuh[cite: 6]</p>
                    <div style="font-size: 1.8rem; font-weight: 800; color: var(--denim-blue); margin-bottom: 15px;">Rp 50.000 <span style="font-size: 0.9rem; color:#64748b;">/ minggu</span></div>
                </div>
                <button class="btn-sewa" onclick="openModal('Paket Mingguan (Rp 50.000/minggu)')">PILIH PAKET INI ⚡</button>
            </div>

        </div>
    </div>

    <!-- MODAL FORM SEWA -->
    <div class="modal-bg" id="modalSewa">
        <div class="modal-body">
            <div class="close-modal" onclick="closeModal()">×</div>
            <h3 style="font-family: 'VT323', monospace; font-size: 1.8rem; margin-bottom: 15px;">📝 DETAILS PESANAN</h3>
            
            <form onsubmit="kirimPesanan(event)">
                <div class="form-group">
                    <label>Paket Dipilih:</label>
                    <input type="text" id="inputPaket" readonly style="background: #e2e8f0; font-weight: bold;">
                </div>
                <div class="form-group">
                    <label>Nama Lengkap Pemesan:</label>
                    <input type="text" id="inputNama" placeholder="Contoh: Keisha Nur Asyifa" required>
                </div>
                <div class="form-group">
                    <label>Kelas / Ruangan:</label>
                    <input type="text" id="inputKelas" placeholder="Contoh: X PPLG 1 / R10" required>
                </div>
                <div class="form-group">
                    <label>Pilih Admin Tujuan (CP):</label>
                    <select id="selectAdmin">
                        <option value="6282115678294">Keisha Nur Asyifa</option>
                        <option value="628813299836">Arin Regina Putri</option>
                        <option value="6285878505289">Mario Mutawakil Mufiid</option>
                        <option value="6287815990414">Muhamad Faatih Agha</option>
                    </select>
                </div>
                <button type="submit" class="btn-kirim">KIRIM KE WHATSAPP 🚀</button>
            </form>
        </div>
    </div>

    <script>
        function openModal(namaPaket) {
            document.getElementById('inputPaket').value = namaPaket;
            document.getElementById('modalSewa').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalSewa').style.display = 'none';
        }

        function kirimPesanan(e) {
            e.preventDefault();
            const paket = document.getElementById('inputPaket').value;
            const nama = document.getElementById('inputNama').value;
            const kelas = document.getElementById('inputKelas').value;
            const noAdmin = document.getElementById('selectAdmin').value;

            // Tersimpan ke database browser (Local) buat Admin
            const pesananBaru = {
                id: Date.now(),
                nama: nama,
                kelas: kelas,
                paket: paket,
                tanggal: new Date().toLocaleDateString('id-ID'),
                status: 'Menunggu'
            };

            let dataPesanan = JSON.parse(localStorage.getItem('pinroll_orders')) || [];
            dataPesanan.push(pesananBaru);
            localStorage.setItem('pinroll_orders', JSON.stringify(dataPesanan));

            // Direct ke Whatsapp
            const pesan = `Halo Admin PinRoll! Saya mau sewa rollan dengan detail berikut:%0A%0A- *Nama:* ${nama}%0A- *Kelas:* ${kelas}%0A- *Paket:* ${paket}%0A%0AApakah unitnya ready?`;
            window.open(`https://wa.me/${noAdmin}?text=${pesan}`, '_blank');
            closeModal();
        }
    </script>
</body>
</html>
